# On every v* tag, builds the RPM (Fedora), the .deb (Debian) and the Arch package in containers and
# attaches them to a GitHub release.
# The tag must match VERSION in the Makefile (same rule as the local tags).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Build dependencies
        run: dnf install -y git make rpm-build rpmdevtools systemd-rpm-macros python3
      - uses: actions/checkout@v7
      - name: Tag matches VERSION
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v="$(sed -n 's/^VERSION := //p' Makefile)"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ VERSION $v"; exit 1; }
      - name: Selftest (fake backend)
        run: python3 ryzenctl selftest
      - name: RPM
        run: make rpm
      - name: Release with the RPM attached
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.rpm
            dist/*.tar.gz
          generate_release_notes: true
  # deb and Arch packages, after the RPM job (tag checked, release created); same scripts as make deb / make arch
  deb:
    needs: rpm
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Build and check the .deb (lintian)
        run: sh packaging/build-deb.sh dist
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
  arch:
    needs: rpm
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and check the Arch package (makepkg, namcap)
        run: sh packaging/build-arch.sh dist
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.pkg.tar.zst
