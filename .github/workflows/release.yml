# On every v* tag, builds the RPM in a Fedora container and attaches it to a GitHub release.
# The tag must match VERSION in the Makefile (same rule as the local tags).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Build dependencies
        run: dnf install -y git make rpm-build rpmdevtools systemd-rpm-macros python3
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v="$(sed -n 's/^VERSION := //p' Makefile)"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ VERSION $v"; exit 1; }
      - name: Selftest (fake backend)
        run: python3 ryzenctl selftest
      - name: RPM
        run: make rpm
      - name: Release with the RPM attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/*.tar.gz
          generate_release_notes: true
